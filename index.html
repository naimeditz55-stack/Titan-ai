<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* Login Screen */
        .login-card { background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-card h2 { color: #38bdf8; margin-bottom: 20px; font-size: 28px; }
        .login-card input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        .login-card button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        /* Main Chat Screen */
        .chat-container { width: 90%; max-width: 500px; height: 90vh; background: #1e293b; border-radius: 16px; display: none; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .chat-header { background: #0f172a; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; color: #38bdf8; border-bottom: 1px solid #334155; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Message Bubbles */
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; position: relative; }
        .user-msg { background: #0284c7; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: #334155; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        .listen-btn { background: none; border: none; color: #38bdf8; cursor: pointer; font-size: 12px; margin-top: 5px; display: block; }
        
        /* Input Area */
        .input-area { display: flex; padding: 10px; background: #0f172a; gap: 8px; border-top: 1px solid #334155; }
        .input-area input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
        .input-area button { padding: 12px; border: none; border-radius: 8px; background: #0284c7; color: white; cursor: pointer; }
        .mic-btn { background: #e11d48 !important; }
    </style>
</head>
<body>

    <!-- 1. Login Screen -->
    <div class="login-card" id="loginScreen">
        <h2>Titan AI</h2>
        <input type="text" id="username" placeholder="यूज़रनेम दर्ज करें">
        <input type="password" id="password" placeholder="पासवर्ड दर्ज करें">
        <button onclick="login()">लॉग इन करें</button>
    </div>

    <!-- 2. Chat Screen -->
    <div class="chat-container" id="chatScreen">
        <div class="chat-header">Titan AI 🤖</div>
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">नमस्ते! मैं Titan AI हूँ। मैं आपकी क्या मदद कर सकता हूँ?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="यहाँ लिखें या माइक से बोलें...">
            <button class="mic-btn" onclick="startVoice()">🎙️</button>
            <button onclick="sendMessage()">भेजें</button>
        </div>
    </div>

    <script>
        // ==========================================
        // AQ.Ab8RN6LkwEcLVtocty6GOCAG6_h5l6JuRFvnd0eoqfNMo-uQ2A
        // ==========================================
        const API_KEY = AQ.Ab8RN6LkwEcLVtocty6GOCAG6_h5l6JuRFvnd0eoqfNMo-uQ2A

        // Login Logic
        function login() {
            const user = document.getElementById('username').value;
            if (user.trim() !== "") {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('chatScreen').style.display = 'flex';
            } else {
                alert("कृपया यूज़रनेम डालें!");
            }
        }

        // Voice to Text (बोलकर टाइप करना)
        function startVoice() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'hi-IN'; // हिंदी भाषा के लिए
                
                recognition.onstart = function() {
                    document.getElementById('userInput').placeholder = "सुन रहा हूँ... बोलिए...";
                };
                
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('userInput').value = transcript;
                    document.getElementById('userInput').placeholder = "यहाँ लिखें या माइक से बोलें...";
                };

                recognition.start();
            } else {
                alert("आपका ब्राउज़र वॉइस टाइपिंग सपोर्ट नहीं करता।");
            }
        }

        // Text to Speech (मैसेज सुनना)
        function speakText(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'hi-IN'; // हिंदी आवाज में सुनने के लिए
            window.speechSynthesis.speak(speech);
        }

        // Send Message & Fetch AI Response
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const messageText = inputField.value.trim();

            if (!messageText) return;

            // Display User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = messageText;
            chatBox.appendChild(userDiv);
            
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Display Placeholder AI Message
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-msg';
            aiDiv.innerText = "Titan AI सोच रहा है...";
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // API Call (Gemini API)
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: messageText }] }]
                    })
                });

                const data = await response.json();
                const aiReply = data.candidates[0].content.parts[0].text;
                
                // Update AI Message
                aiDiv.innerHTML = `${aiReply} <button class="listen-btn" onclick="speakText(\`${aiReply.replace(/'/g, "\\'")}\`)">🔊 सुनें</button>`;
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                aiDiv.innerText = "माफ़ कीजिए, कोई गड़बड़ी हुई। कृपया API Key जांचें।";
            }
        }
    </script>
</body>
</html>
