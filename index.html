<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN AI - Cold Theme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        /* Fixed full-screen lock to prevent any overflow/jumping */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            background-image: 
                radial-gradient(at 10% 10%, rgba(14, 116, 144, 0.25) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(56, 189, 248, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            -webkit-user-select: none;
            user-select: none;
        }

        .titan-font { font-family: 'Orbitron', sans-serif; }
        
        .glass-panel { 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2); 
        }

        /* Typing Cursor */
        .typing-cursor::after {
            content: '▋';
            display: inline;
            animation: blink 0.7s infinite;
            color: #38bdf8;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #0369a1; border-radius: 3px; }
        
        button, select, input, a {
            pointer-events: auto !important;
            cursor: pointer;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between h-full w-full overflow-hidden">

    <!-- Header: strictly contained inside screen dimensions -->
    <header class="w-full px-2.5 py-2 border-b border-cyan-900/50 flex justify-between items-center glass-panel z-20 shrink-0">
        <div class="flex items-center gap-1.5 shrink-0">
            <div class="w-6 h-6 rounded-md bg-gradient-to-tr from-cyan-600 to-blue-700 flex items-center justify-center shadow-md shadow-cyan-500/20">
                <span class="titan-font text-xs font-black text-white">T</span>
            </div>
            <h1 class="titan-font text-xs font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-sky-200">
                TITAN<span class="text-[8px] text-cyan-400 ml-0.5">AI</span>
            </h1>
        </div>
        
        <!-- Controls row bounded strictly to avoid layout breaks -->
        <div class="flex items-center gap-1 overflow-x-auto max-w-[72%] py-0.5">
            <select id="voice-selector" class="bg-slate-950 border border-cyan-800/60 text-[10px] text-cyan-300 font-medium rounded px-1 py-1 focus:outline-none shrink-0">
                <option value="titan_core">🤖 Core</option>
                <option value="jarvis">⚙️ Jarvis</option>
                <option value="aarav">👨 Aarav</option>
                <option value="ananya">👩 Ananya</option>
            </select>

            <button onclick="openTitanLive()" class="bg-cyan-950 border border-cyan-500/50 hover:bg-cyan-900 text-cyan-300 px-1.5 py-1 rounded text-[10px] font-bold transition flex items-center gap-1 shrink-0">
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span> LIVE
            </button>

            <div id="auth-btn-container" class="shrink-0">
                <button onclick="loginWithGoogle()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-[10px] px-2 py-1 rounded font-semibold shrink-0">
                    Login
                </button>
            </div>

            <button onclick="toggleHistoryDrawer()" class="p-1 bg-slate-900 hover:bg-slate-800 rounded text-cyan-400 border border-cyan-900 text-xs shrink-0">
                ⋮
            </button>
        </div>
    </header>

    <!-- Chat Box: perfectly bounded in middle space -->
    <div class="flex-1 w-full max-w-4xl mx-auto overflow-y-auto p-2.5 space-y-2.5" id="chat-box">
        <div class="flex justify-start">
            <div class="glass-panel p-2.5 rounded-lg max-w-xs border-l-2 border-cyan-400 text-[11px] text-cyan-100 shadow">
                नमस्ते! TITAN AI कोल्ड थीम मोड में तैयार है। सभी आइकॉन स्क्रीन के अंदर फिक्स्ड हैं।
            </div>
        </div>
    </div>

    <!-- TITAN LIVE Modal -->
    <div id="titan-live-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 hidden flex-col items-center justify-between p-3">
        <div class="w-full flex justify-between items-center max-w-sm border-b border-cyan-900 pb-2">
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                <h2 class="titan-font text-[11px] font-bold text-cyan-400 tracking-wider">TITAN COLD LIVE</h2>
            </div>
            <button onclick="closeTitanLive()" class="text-[10px] bg-slate-900 border border-cyan-900 px-2 py-0.5 rounded text-cyan-300">✕ Close</button>
        </div>

        <div class="relative w-full max-w-sm aspect-video bg-black rounded-lg overflow-hidden border border-cyan-500/30 my-auto shadow flex items-center justify-center">
            <video id="live-video" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
            <div class="absolute top-2 left-2 bg-slate-950/80 px-2 py-0.5 rounded border border-cyan-900 text-[9px] text-cyan-400 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span> Active
            </div>
        </div>

        <div class="w-full max-w-sm flex flex-col gap-1.5">
            <div class="flex justify-between items-center bg-slate-900/90 border border-cyan-900/80 px-2 py-1 rounded text-[11px]">
                <span class="text-cyan-400">Live Voice:</span>
                <select id="live-voice-selector" class="bg-slate-950 border border-cyan-800 text-cyan-200 text-[10px] rounded px-1 py-0.5 focus:outline-none">
                    <option value="titan_core">🤖 Core</option>
                    <option value="jarvis">⚙️ Jarvis</option>
                    <option value="aarav">👨 Aarav</option>
                    <option value="ananya">👩 Ananya</option>
                </select>
            </div>
            <p id="live-transcript" class="text-[10px] text-cyan-300 italic text-center truncate">Listening...</p>
        </div>

        <div class="w-full max-w-sm flex justify-center">
            <button onclick="switchCamera()" class="bg-slate-900 border border-cyan-800 text-cyan-300 text-[10px] px-2.5 py-1 rounded">
                🔄 Switch Camera
            </button>
        </div>
    </div>

    <!-- History Drawer -->
    <div id="history-drawer" class="fixed inset-y-0 right-0 w-60 bg-slate-950/95 border-l border-cyan-900/60 p-2.5 z-50 transform translate-x-full transition-transform duration-200 flex flex-col shadow-xl">
        <div class="flex justify-between items-center pb-2 border-b border-cyan-900">
            <h2 class="text-[11px] font-bold text-cyan-400 uppercase tracking-wider">History</h2>
            <button onclick="toggleHistoryDrawer()" class="text-cyan-400 text-xs">✕</button>
        </div>
        <div id="history-list" class="flex-1 overflow-y-auto mt-2 space-y-1 text-[10px]">
            <p class="text-cyan-600 text-center mt-4">Login to view history</p>
        </div>
    </div>

    <!-- Main Input Bar: strictly constrained inside bottom boundary -->
    <div class="w-full p-2 border-t border-cyan-900/55 glass-panel shrink-0 z-20">
        <div class="max-w-4xl mx-auto flex gap-1.5 items-center">
            <button onclick="startVoiceRecognition()" class="bg-slate-900 border border-cyan-800 text-cyan-400 p-2 rounded text-xs shrink-0">
                🎤
            </button>
            <input type="text" id="user-input" placeholder="Message TITAN AI (/image ...)" 
                   class="flex-1 bg-slate-950 border border-cyan-900/80 rounded px-2.5 py-1.5 text-[11px] text-cyan-100 focus:outline-none focus:border-cyan-400 min-w-0">
            <button onclick="sendMessage()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded text-[11px] font-semibold shrink-0">
                Send
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null, cameraStream = null, currentFacingMode = "user", isLiveActive = false, liveSpeechRecognition = null;

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-btn-container').innerHTML = `
                    <div class="flex items-center gap-1 bg-slate-900 px-1 py-0.5 rounded border border-cyan-900 text-[10px]">
                        <img src="${user.photoURL}" class="w-3 h-3 rounded-full"/>
                        <span class="truncate max-w-[45px] text-cyan-300">${user.displayName.split(' ')[0]}</span>
                        <button onclick="auth.signOut().then(()=>location.reload())" class="text-cyan-500 ml-0.5">✕</button>
                    </div>`;
                loadCloudHistory();
            } else {
                currentUser = null;
                document.getElementById('auth-btn-container').innerHTML = `
                    <button onclick="loginWithGoogle()" class="bg-cyan-600 text-white text-[10px] px-2 py-1 rounded font-semibold">Login</button>`;
            }
        });

        function loginWithGoogle() {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert(e.message));
        }

        async function openTitanLive() {
            const modal = document.getElementById('titan-live-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            isLiveActive = true;
            try {
                if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: false });
                document.getElementById('live-video').srcObject = cameraStream;
            } catch (e) { alert("Camera error"); }
            initLiveVoice();
        }

        function switchCamera() {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            openTitanLive();
        }

        function closeTitanLive() {
            isLiveActive = false;
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            if (liveSpeechRecognition) liveSpeechRecognition.stop();
            window.speechSynthesis.cancel();
            const modal = document.getElementById('titan-live-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function initLiveVoice() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return;
            liveSpeechRecognition = new SpeechRec();
            liveSpeechRecognition.lang = 'hi-IN';
            liveSpeechRecognition.continuous = true;
            
            liveSpeechRecognition.onresult = async function(event) {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                if (!transcript) return;
                document.getElementById('live-transcript').innerText = `You: "${transcript}"`;
                
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: "Provide a helpful response: " + transcript }] }] })
                    });
                    const data = await response.json();
                    const reply = data.candidates[0].content.parts[0].text;
                    document.getElementById('live-transcript').innerText = `TITAN: "${reply}"`;
                    speakLiveText(reply);
                } catch (e) {
                    document.getElementById('live-transcript').innerText = "Error processing.";
                }
            };
            liveSpeechRecognition.onend = function() { if (isLiveActive) liveSpeechRecognition.start(); };
            liveSpeechRecognition.start();
        }

        function speakLiveText(text) {
            window.speechSynthesis.cancel();
            const clean = text.replace(/<[^>]*?>/g, '');
            const utter = new SpeechSynthesisUtterance(clean);
            const voiceType = document.getElementById('live-voice-selector').value;
            if(voiceType === 'jarvis') { utter.pitch = 0.5; utter.rate = 0.9; }
            else if(voiceType === 'aarav') { utter.pitch = 1.0; utter.rate = 1.0; }
            else if(voiceType === 'ananya') { utter.pitch = 1.4; utter.rate = 1.05; }
            utter.lang = /[ऀ-ॿ]/.test(clean) ? 'hi-IN' : 'en-US';
            window.speechSynthesis.speak(utter);
        }

        function toggleHistoryDrawer() {
            document.getElementById('history-drawer').classList.toggle('translate-x-full');
        }

        function speakText(text) {
            window.speechSynthesis.cancel();
            const clean = text.replace(/<[^>]*?>/g, '');
            const utter = new SpeechSynthesisUtterance(clean);
            const voiceType = document.getElementById('voice-selector').value;
            if(voiceType === 'jarvis') { utter.pitch = 0.5; utter.rate = 0.9; }
            else if(voiceType === 'aarav') { utter.pitch = 1.0; utter.rate = 1.0; }
            else if(voiceType === 'ananya') { utter.pitch = 1.4; utter.rate = 1.05; }
            utter.lang = /[ऀ-ॿ]/.test(clean) ? 'hi-IN' : 'en-US';
            window.speechSynthesis.speak(utter);
        }

        async function saveToCloud(sender, text) {
            if (!currentUser) return;
            await db.collection("users").doc(currentUser.uid).collection("chats").add({
                sender, text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function loadCloudHistory() {
            if (!currentUser) return;
            db.collection("users").doc(currentUser.uid).collection("chats").orderBy("timestamp", "asc").onSnapshot(snap => {
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = '';
                snap.forEach(doc => {
                    const data = doc.data();
                    renderUI(data.sender, data.text, false);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function renderUI(sender, text, typing) {
            const chatBox = document.getElementById('chat-box');
            const id = 'msg-' + Math.random().toString(36).substr(2, 9);
            if (sender === 'user') {
                chatBox.innerHTML += `<div class="flex justify-end"><div class="bg-cyan-600 text-white p-2 rounded-lg max-w-xs text-[11px] shadow">${text}</div></div>`;
            } else {
                if (typing && !text.includes('<img')) {
                    chatBox.innerHTML += `<div class="flex justify-start"><div id="${id}" class="glass-panel p-2 rounded-lg max-w-xs text-[11px] text-cyan-100 shadow typing-cursor"></div></div>`;
                    typeWriter(id, text);
                } else {
                    chatBox.innerHTML += `<div class="flex justify-start"><div class="glass-panel p-2 rounded-lg max-w-xs text-[11px] text-cyan-100 shadow">${text}</div></div>`;
                }
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function typeWriter(id, text) {
            const el = document.getElementById(id);
            if (!el) return;
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML = text.substring(0, i + 1).replace(/\\n/g, '<br>');
                    i++;
                    setTimeout(type, 10);
                } else {
                    el.classList.remove('typing-cursor');
                }
            }
            type();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            renderUI('user', text, false);
            await saveToCloud('user', text);

            if (text.startsWith('/image ') || text.startsWith('/video ')) {
                const prompt = encodeURIComponent(text.replace(/^\/(image|video)\s+/, ''));
                const isImg = text.startsWith('/image ');
                const url = isImg ? `https://pollinations.ai/p/${prompt}?width=800&height=800&seed=${Math.random()}` : `https://pollinations.ai/p/${prompt}?width=640&height=360&model=turbo&seed=${Math.random()}`;
                const resHtml = `${isImg ? '🎨 Image' : '🎬 Video'}:<br><img src="${url}" class="rounded mt-1 max-w-full border border-cyan-900"/>`;
                renderUI('titan', resHtml, false);
                await saveToCloud('titan', resHtml);
                return;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Provide a helpful response: " + text }] }] })
                });
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                
                renderUI('titan', reply, true);
                await saveToCloud('titan', reply);
                speakText(reply);
            } catch (e) {
                renderUI('titan', '⚠️ Connection error.', true);
            }
        }

        function startVoiceRecognition() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return;
            const rec = new SpeechRec();
            rec.lang = 'hi-IN';
            rec.start();
            rec.onresult = e => document.getElementById('user-input').value = e.results[0][0].transcript;
        }
    </script>
</body>
                    </html>
