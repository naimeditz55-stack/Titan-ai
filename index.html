<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN AI - Fixed & Clickable Suite</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        /* Fixed Viewport Layout - Prevents jumping, scrolling outside, resizing */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(88, 28, 135, 0.3) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(15, 23, 42, 0.95) 0px, transparent 50%);
            background-attachment: fixed;
            -webkit-user-select: none;
            user-select: none;
        }

        .titan-font { font-family: 'Orbitron', sans-serif; }
        
        .glass-panel { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            pointer-events: auto !important;
        }

        /* Typing Cursor */
        .typing-cursor::after {
            content: '▋';
            display: inline;
            animation: blink 0.7s infinite;
            color: #3b82f6;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Custom Scrollbar for chat and drawers */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        
        /* Force clickable interactive elements */
        button, select, input, a, label {
            pointer-events: auto !important;
            cursor: pointer;
        }
    </style>
</head>
<body class="text-white flex flex-col justify-between">

    <!-- Header (Fixed height, non-moving) -->
    <header class="w-full px-4 py-3 border-b border-slate-800/80 flex justify-between items-center glass-panel z-20 shrink-0">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-600/30">
                <span class="titan-font text-base font-black">T</span>
            </div>
            <div>
                <h1 class="titan-font text-base font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
                    TITAN<span class="text-[10px] text-blue-500 ml-0.5">AI</span>
                </h1>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <!-- Voice Selector -->
            <select id="voice-selector" class="bg-slate-900 border border-slate-700 text-[11px] text-blue-400 font-medium rounded-lg px-2 py-1.5 focus:outline-none focus:border-blue-500">
                <option value="titan_core">🤖 TITAN Core</option>
                <option value="jarvis">⚙️ Jarvis</option>
                <option value="aarav">👨 Aarav (Hindi)</option>
                <option value="ananya">👩 Ananya (Hindi)</option>
            </select>

            <!-- FIXED BUTTON: Text is now 'TITAN LIVE', on click opens modal -->
            <button onclick="openTitanLive()" class="bg-red-600/20 border border-red-500/60 hover:bg-red-600 text-red-400 hover:text-white px-2.5 py-1.5 rounded-lg text-[11px] font-bold transition flex items-center gap-1.5 shadow-md">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> TITAN LIVE
            </button>

            <!-- Auth Container -->
            <div id="auth-btn-container">
                <button onclick="loginWithGoogle()" class="bg-blue-600 hover:bg-blue-500 text-white text-[11px] px-2.5 py-1.5 rounded-lg font-semibold transition">
                    Login
                </button>
            </div>

            <!-- History Toggle -->
            <button onclick="toggleHistoryDrawer()" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 border border-slate-700">
                ⋮
            </button>
        </div>
    </header>

    <!-- Chat Screen Area (Scrollable middle container that doesn't push layout) -->
    <div id="chat-box" class="flex-1 w-full max-w-4xl mx-auto overflow-y-auto p-4 space-y-4">
        <div class="flex justify-start">
            <div class="glass-panel p-3.5 rounded-2xl max-w-md border-l-2 border-blue-500 text-xs md:text-sm text-slate-200 shadow-xl">
                नमस्ते! मैं TITAN AI हूँ। यह लेआउट पूरी तरह स्थिर (Fixed) और क्लिकेबल है। ऊपर दिए गए <strong>'TITAN LIVE'</strong> बटन से आप लाइव वीडियो और वॉइस चैट शुरू कर सकते हैं!
            </div>
        </div>
    </div>

    <!-- 🔴 TITAN LIVE MODAL (Fixed Overlay with Voice Selector Support) -->
    <div id="titan-live-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-2xl z-50 hidden flex-col items-center justify-between p-4 md:p-6">
        <div class="w-full flex justify-between items-center max-w-md border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-red-500 animate-ping"></span>
                <h2 class="titan-font text-xs md:text-sm font-bold text-red-500 tracking-wider">TITAN LIVE STREAM</h2>
            </div>
            <button onclick="closeTitanLive()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-lg font-bold">✕ Close</button>
        </div>

        <div class="relative w-full max-w-md aspect-video bg-black rounded-2xl overflow-hidden border border-red-500/40 shadow-2xl my-auto flex items-center justify-center">
            <video id="live-video" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
            <div class="absolute top-3 left-3 bg-slate-900/80 px-2.5 py-1 rounded-full border border-slate-700 text-[10px] text-emerald-400 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Active Voice Live
            </div>
        </div>

        <div class="w-full max-w-md flex flex-col gap-2">
            <!-- Voice Selector inside Live Modal -->
            <div class="flex justify-between items-center bg-slate-900/80 border border-slate-800 px-3 py-2 rounded-xl text-xs">
                <span class="text-slate-400">Live Voice Mode:</span>
                <select id="live-voice-selector" class="bg-slate-950 border border-slate-700 text-blue-400 font-medium rounded-lg px-2 py-1 focus:outline-none">
                    <option value="titan_core">🤖 TITAN Core</option>
                    <option value="jarvis">⚙️ Jarvis</option>
                    <option value="aarav">👨 Aarav (Hindi)</option>
                    <option value="ananya">👩 Ananya (Hindi)</option>
                </select>
            </div>
            <p id="live-transcript" class="text-xs text-slate-400 italic text-center">Listening for your command...</p>
        </div>

        <div class="w-full max-w-md flex justify-center gap-3">
            <button onclick="switchCamera()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs px-4 py-2 rounded-xl shadow">
                🔄 Switch Camera
            </button>
        </div>
    </div>

    <!-- History Drawer (Fixed Slide-over) -->
    <div id="history-drawer" class="fixed inset-y-0 right-0 w-72 bg-slate-950/95 border-l border-slate-800 p-4 z-50 transform translate-x-full transition-transform duration-200 flex flex-col shadow-2xl">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800">
            <h2 class="text-xs font-bold text-blue-400 uppercase tracking-wider">History</h2>
            <button onclick="toggleHistoryDrawer()" class="text-slate-400 hover:text-white p-1">✕</button>
        </div>
        <div id="history-list" class="flex-1 overflow-y-auto mt-3 space-y-2 text-xs">
            <p class="text-slate-500 text-center mt-4">Login to view history</p>
        </div>
    </div>

    <!-- Main Input Bar (Fixed bottom layout, non-shifting) -->
    <div class="w-full p-3 md:p-4 border-t border-slate-800/80 glass-panel shrink-0 z-20">
        <div class="max-w-4xl mx-auto flex gap-2 items-center">
            <button onclick="startVoiceRecognition()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-purple-400 p-2.5 md:p-3 rounded-xl transition shadow">
                🎤
            </button>
            <input type="text" id="user-input" placeholder="Message TITAN AI (/image ..., /video ...)" 
                   class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 md:py-3 text-xs md:text-sm text-white focus:outline-none focus:border-blue-500">
            <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 md:px-5 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-semibold transition shadow-lg shadow-blue-600/30">
                Send
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null, allUserHistory = [], cameraStream = null, currentFacingMode = "user", isLiveActive = false;
        let liveSpeechRecognition = null;

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-btn-container').innerHTML = `
                    <div class="flex items-center gap-1.5 bg-slate-900 px-2 py-1 rounded-lg border border-slate-700 text-xs">
                        <img src="${user.photoURL}" class="w-4 h-4 rounded-full"/>
                        <span class="truncate max-w-[70px]">${user.displayName.split(' ')[0]}</span>
                        <button onclick="auth.signOut().then(()=>location.reload())" class="text-red-400 ml-1 font-bold">✕</button>
                    </div>`;
                loadCloudHistory();
            } else {
                currentUser = null;
                document.getElementById('auth-btn-container').innerHTML = `
                    <button onclick="loginWithGoogle()" class="bg-blue-600 hover:bg-blue-500 text-white text-[11px] px-2.5 py-1.5 rounded-lg font-semibold">Login</button>`;
            }
        });

        function loginWithGoogle() {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert(e.message));
        }

        async function openTitanLive() {
            const modal = document.getElementById('titan-live-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            isLiveActive = true;
            try {
                if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: false });
                document.getElementById('live-video').srcObject = cameraStream;
            } catch (e) { alert("Camera permission required!"); }
            initLiveVoice();
        }

        function switchCamera() {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            openTitanLive();
        }

        function closeTitanLive() {
            isLiveActive = false;
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            if (liveSpeechRecognition) liveSpeechRecognition.stop();
            window.speechSynthesis.cancel();
            const modal = document.getElementById('titan-live-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function initLiveVoice() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return;
            liveSpeechRecognition = new SpeechRec();
            liveSpeechRecognition.lang = 'hi-IN';
            liveSpeechRecognition.continuous = true;
            
            liveSpeechRecognition.onresult = async function(event) {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                if (!transcript) return;
                document.getElementById('live-transcript').innerText = `You: "${transcript}"`;
                
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: "Provide a helpful response: " + transcript }] }] })
                    });
                    const data = await response.json();
                    const reply = data.candidates[0].content.parts[0].text;
                    document.getElementById('live-transcript').innerText = `TITAN: "${reply}"`;
                    speakLiveText(reply);
                } catch (e) {
                    document.getElementById('live-transcript').innerText = "Error processing command.";
                }
            };
            liveSpeechRecognition.onend = function() { if (isLiveActive) liveSpeechRecognition.start(); };
            liveSpeechRecognition.start();
        }

        function speakLiveText(text) {
            window.speechSynthesis.cancel();
            const clean = text.replace(/<[^>]*?>/g, '');
            const utter = new SpeechSynthesisUtterance(clean);
            const voiceType = document.getElementById('live-voice-selector').value;
            if(voiceType === 'jarvis') { utter.pitch = 0.5; utter.rate = 0.9; }
            else if(voiceType === 'aarav') { utter.pitch = 1.0; utter.rate = 1.0; }
            else if(voiceType === 'ananya') { utter.pitch = 1.4; utter.rate = 1.05; }
            utter.lang = /[\u0900-\u097F]/.test(clean) ? 'hi-IN' : 'en-US';
            window.speechSynthesis.speak(utter);
        }

        function toggleHistoryDrawer() {
            document.getElementById('history-drawer').classList.toggle('translate-x-full');
        }

        function speakText(text) {
            window.speechSynthesis.cancel();
            const clean = text.replace(/<[^>]*?>/g, '');
            const utter = new SpeechSynthesisUtterance(clean);
            const voiceType = document.getElementById('voice-selector').value;
            if(voiceType === 'jarvis') { utter.pitch = 0.5; utter.rate = 0.9; }
            else if(voiceType === 'aarav') { utter.pitch = 1.0; utter.rate = 1.0; }
            else if(voiceType === 'ananya') { utter.pitch = 1.4; utter.rate = 1.05; }
            utter.lang = /[\u0900-\u097F]/.test(clean) ? 'hi-IN' : 'en-US';
            window.speechSynthesis.speak(utter);
        }

        async function saveToCloud(sender, text) {
            if (!currentUser) return;
            await db.collection("users").doc(currentUser.uid).collection("chats").add({
                sender, text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function loadCloudHistory() {
            if (!currentUser) return;
            db.collection("users").doc(currentUser.uid).collection("chats").orderBy("timestamp", "asc").onSnapshot(snap => {
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = '';
                allUserHistory = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    allUserHistory.push(data);
                    renderUI(data.sender, data.text, false);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
                renderHistoryList(allUserHistory);
            });
        }

        function renderUI(sender, text, typing) {
            const chatBox = document.getElementById('chat-box');
            const id = 'msg-' + Math.random().toString(36).substr(2, 9);
            if (sender === 'user') {
                chatBox.innerHTML += `<div class="flex justify-end"><div class="bg-blue-600 text-white p-3 rounded-2xl max-w-md text-xs md:text-sm shadow-md">${text}</div></div>`;
            } else {
                if (typing && !text.includes('<img')) {
                    chatBox.innerHTML += `<div class="flex justify-start"><div id="${id}" class="glass-panel p-3.5 rounded-2xl max-w-md text-xs md:text-sm text-slate-200 shadow-lg typing-cursor"></div></div>`;
                    typeWriter(id, text);
                } else {
                    chatBox.innerHTML += `<div class="flex justify-start"><div class="glass-panel p-3.5 rounded-2xl max-w-md text-xs md:text-sm text-slate-200 shadow-lg">${text}</div></div>`;
                }
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function typeWriter(id, text) {
            const el = document.getElementById(id);
            if (!el) return;
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML = text.substring(0, i + 1).replace(/\n/g, '<br>');
                    i++;
                    setTimeout(type, 10);
                } else {
                    el.classList.remove('typing-cursor');
                }
            }
            type();
        }

        function renderHistoryList(history) {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            history.filter(h => h.sender === 'user').reverse().forEach(h => {
                list.innerHTML += `<div class="p-2 bg-slate-900 border border-slate-800 rounded-lg text-slate-300 truncate">💬 ${h.text}</div>`;
            });
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            renderUI('user', text, false);
            await saveToCloud('user', text);

            if (text.startsWith('/image ') || text.startsWith('/video ')) {
                const prompt = encodeURIComponent(text.replace(/^\/(image|video)\s+/, ''));
                const isImg = text.startsWith('/image ');
                const url = isImg ? `https://pollinations.ai/p/${prompt}?width=1024&height=1024&seed=${Math.random()}` : `https://pollinations.ai/p/${prompt}?width=800&height=450&model=t
